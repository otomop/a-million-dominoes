[project]
name = "dominoes"
version = "1.0.0"
description = "Compiles a logic-gate network into a field of dominoes"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "numba>=0.60"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["dominoes"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E741", "F403", "F405", "E731", "F841", "E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
